<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Tilt Ball</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
      pointer-events: none;
    }

    .btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(80, 80, 80, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 18px;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle {
      position: relative;
      width: min(78vw, 340px);
      height: min(78vw, 340px);
      border-radius: 50%;
      background: #3a3a3a;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
    }

    .ball {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f5f5f5;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #eee;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }

    .overlay.hidden {
      display: none !important;
    }

    .overlay h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .overlay p {
      font-size: 0.95rem;
      opacity: 0.85;
      max-width: 300px;
      line-height: 1.45;
    }

    .start-btn {
      margin-top: 12px;
      padding: 16px 44px;
      border: none;
      border-radius: 999px;
      background: #f0f0f0;
      color: #111;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 150px;
    }

    .start-btn:active {
      transform: scale(0.96);
      background: #ddd;
    }

    .start-btn:disabled {
      opacity: 0.6;
    }

    .status {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #aaa;
      min-height: 1.3em;
      max-width: 280px;
    }

    .hint {
      position: fixed;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      z-index: 5;
      pointer-events: none;
    }

    .note {
      position: fixed;
      bottom: 58px;
      left: 16px;
      right: 16px;
      text-align: center;
      color: #555;
      font-size: 0.72rem;
      z-index: 5;
      pointer-events: none;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="btn">•••</div>
    <div class="btn">+</div>
  </div>

  <div class="stage">
    <div class="circle" id="circle">
      <div class="ball" id="ball"></div>
    </div>
  </div>

  <div class="hint" id="hint">Tilt your phone to move the ball</div>
  <div class="note" id="note"></div>

  <div class="overlay" id="overlay">
    <h1>Tilt Ball</h1>
    <p>Tilt your iPhone to move the ball.<br>It stays inside the circle.</p>
    <button class="start-btn" id="startBtn">Start</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const circle = document.getElementById('circle');
    const ball = document.getElementById('ball');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const hintEl = document.getElementById('hint');
    const noteEl = document.getElementById('note');

    let maxDist = 0;
    let posX = 0;
    let posY = 0;
    let targetX = 0;
    let targetY = 0;

    const SENSITIVITY = 2.4;
    const SMOOTHING = 0.18;
    const EDGE_THRESHOLD = 0.90;

    let isRunning = false;
    let lastVibrate = 0;
    let wasNearEdge = false;
    let hasSensorData = false;

    function setStatus(msg) {
      statusEl.textContent = msg || '';
    }

    function measure() {
      const rect = circle.getBoundingClientRect();
      const radius = rect.width / 2;
      const ballR = (ball.offsetWidth / 2) || 21;
      maxDist = Math.max(8, radius - ballR - 2);
    }

    function setBallPosition(x, y) {
      ball.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    }

    function clampToCircle(x, y) {
      const dist = Math.hypot(x, y);
      if (dist > maxDist && maxDist > 0) {
        const scale = maxDist / dist;
        return { x: x * scale, y: y * scale };
      }
      return { x, y };
    }

    function tryVibrate(pattern) {
      // Note: navigator.vibrate is NOT supported on iOS Safari.
      // This will only work on Android or later in a native app (Core Haptics).
      if (navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    }

    function onOrientation(event) {
      if (!isRunning) return;

      const beta = event.beta;   // front-back
      const gamma = event.gamma; // left-right

      if (beta == null || gamma == null) return;

      if (!hasSensorData) {
        hasSensorData = true;
        hintEl.textContent = 'Tilt your phone to move the ball';
        noteEl.textContent = '';
      }

      // Neutral when holding phone roughly upright
      const neutralBeta = 48;
      let nx = gamma / 26;
      let ny = (beta - neutralBeta) / 26;

      nx = Math.max(-1.6, Math.min(1.6, nx));
      ny = Math.max(-1.6, Math.min(1.6, ny));

      targetX = nx * maxDist * SENSITIVITY * 0.48;
      targetY = ny * maxDist * SENSITIVITY * 0.48;
    }

    function tick() {
      if (!isRunning) {
        requestAnimationFrame(tick);
        return;
      }

      // Smooth movement
      posX += (targetX - posX) * SMOOTHING;
      posY += (targetY - posY) * SMOOTHING;

      const clamped = clampToCircle(posX, posY);
      posX = clamped.x;
      posY = clamped.y;
      setBallPosition(posX, posY);

      // Edge detection + vibration attempt
      const dist = Math.hypot(posX, posY);
      const edgeRatio = maxDist > 0 ? dist / maxDist : 0;

      if (edgeRatio >= EDGE_THRESHOLD) {
        const now = performance.now();
        if (now - lastVibrate > 100) {
          lastVibrate = now;
          const strength = (edgeRatio - EDGE_THRESHOLD) / (1 - EDGE_THRESHOLD);

          if (strength > 0.85) {
            tryVibrate([40, 25, 55]);
          } else if (strength > 0.5) {
            tryVibrate(30);
          } else {
            tryVibrate(15);
          }
        }

        if (!wasNearEdge && edgeRatio > 0.97) {
          tryVibrate([60, 30, 70]);
        }
        wasNearEdge = true;
      } else {
        wasNearEdge = false;
      }

      requestAnimationFrame(tick);
    }

    async function start() {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting…';
      setStatus('Requesting motion access…');

      // Required on iOS
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state !== 'granted') {
            setStatus('Motion permission denied. Enable it in Settings → Safari → Motion & Orientation Access.');
            startBtn.disabled = false;
            startBtn.textContent = 'Try Again';
            return;
          }
        } catch (err) {
          console.warn(err);
          setStatus('Permission error. Try adding this page to your Home Screen, then open it from there.');
          startBtn.disabled = false;
          startBtn.textContent = 'Try Again';
          return;
        }
      }

      measure();
      window.addEventListener('deviceorientation', onOrientation, true);

      isRunning = true;
      overlay.classList.add('hidden');
      requestAnimationFrame(tick);

      // Check if we actually receive data
      setTimeout(() => {
        if (!hasSensorData) {
          hintEl.textContent = 'No tilt data received';
          noteEl.textContent = 'On iPhone this usually needs HTTPS or being added to the Home Screen.';
        }
      }, 2000);
    }

    function handleStart(e) {
      e.preventDefault();
      e.stopPropagation();
      start();
    }

    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchend', handleStart, { passive: false });

    // Block scrolling
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    window.addEventListener('resize', () => {
      measure();
      const clamped = clampToCircle(posX, posY);
      posX = clamped.x;
      posY = clamped.y;
      setBallPosition(posX, posY);
    });

    measure();
    setBallPosition(0, 0);
  </script>
</body>
</html>
